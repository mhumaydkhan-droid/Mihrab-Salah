<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8e9e9"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mihrab"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>Mihrab Salah</title>
<style>
:root{--bg:#e8e9e9;--panel:#f5f5f4;--white:#fff;--ink:#303737;--muted:#737c79;--line:#d6dcda;--green:#2f855a;--greenbg:#e1f2e7;--yellow:#a87800;--yellowbg:#fff0bd;--sage:#596d67;--soft:#dce3df;--shadow:0 8px 25px #26352e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9db8ad;outline-offset:2px}.app{max-width:760px;margin:auto;padding:16px 13px 30px}.hero{padding:21px;border-radius:23px;background:#d9dfdc;border:1px solid #cbd3cf;box-shadow:var(--shadow)}.eyebrow{font-size:.72rem;letter-spacing:.12em;color:#65716c;font-weight:800}.herohead{display:flex;justify-content:space-between;align-items:center;gap:12px}.hero h1{font-size:1.75rem;margin:6px 0}.date{color:#626d68;font-size:.9rem}.crescent{font-size:2.2rem;color:var(--sage)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.stat{padding:12px;background:#eef0ef;border:1px solid #d5dcda;border-radius:15px}.stat span{font-size:.78rem;color:var(--muted)}.stat strong{display:block;font-size:1.6rem;margin-top:3px}.section{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:15px;box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}h2{font-size:1.08rem;margin:0}p{color:var(--muted);font-size:.86rem;line-height:1.45;margin:6px 0}.sub{font-size:.8rem;color:var(--muted)}.datepick{display:flex;align-items:center;gap:8px;margin:12px 0}.datepick input,.monthpick{border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 10px;color:var(--ink);min-width:0}.datepick input{flex:1}.datearrow{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sage);font-size:1.35rem;font-weight:800}.prayerlist{display:grid;grid-template-columns:1fr;gap:9px}.prayer{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;transition:background .15s,border-color .15s}.prayer.is-on{background:var(--greenbg);border-color:#9ccbad}.prayer.is-qaza{background:var(--yellowbg);border-color:#e4cd77}.prayerhead{display:flex;align-items:center;gap:10px}.prayericon{width:41px;height:41px;border-radius:13px;background:#e8ecea;display:grid;place-items:center;font-size:1.2rem}.pname{font-weight:780}.rakats{font-size:.78rem;color:var(--muted);margin-top:2px}.status{margin-left:auto;font-size:.74rem;font-weight:800;border-radius:999px;padding:6px 9px;white-space:nowrap;background:#f0f1f0;color:#7a827f}.status.on{background:var(--greenbg);color:var(--green)}.status.qaza{background:var(--yellowbg);color:var(--yellow)}.toggle{display:flex;gap:8px;margin-top:11px}.toggle .btn{flex:1}.prayer.is-on .btn.green{background:#bfe4cb;border-color:#83bf97}.prayer.is-qaza .btn.yellow{background:#f7df83;border-color:#d7b94f}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:#f8f9f8;color:var(--ink);font-weight:750}.btn.green{color:var(--green);background:var(--greenbg);border-color:#b8d8c2}.btn.yellow{color:var(--yellow);background:var(--yellowbg);border-color:#ead68d}.btn.active{box-shadow:inset 0 0 0 2px currentColor}.secondary{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:9px 11px;font-weight:650}.primary{width:100%;border:0;border-radius:12px;background:var(--sage);color:#fff;padding:12px;font-weight:750;margin-top:10px}.counterrow{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.counterrow:last-child{border-bottom:0}.cmeta{flex:1;min-width:0}.cmeta b{display:block}.cmeta small{display:block;color:var(--muted);font-size:.77rem;margin-top:3px}.step{width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:1.2rem}.count{min-width:23px;text-align:center;font-weight:800}.progresswrap{height:10px;border-radius:999px;background:#d9dedb;overflow:hidden;margin:9px 0 6px}.progress{height:100%;width:0;background:var(--green);border-radius:999px;transition:width .2s}.progress.yellow{background:#d3ad36}.reportbox{background:#e9eeeb;border:1px solid #d2dcd6;border-radius:15px;padding:13px;margin-top:12px}.reportrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #d5dfd9;font-size:.87rem}.reportrow:last-child{border:0}.reportrow strong{font-variant-numeric:tabular-nums;text-align:right}.nav{position:sticky;bottom:8px;display:flex;gap:5px;background:#f7f8f7eF;backdrop-filter:blur(10px);padding:6px;border:1px solid var(--line);border-radius:16px;margin-top:15px}.nav button{flex:1;border:0;background:transparent;color:#68736e;padding:10px 2px;border-radius:11px;font-weight:750;font-size:.8rem}.nav button.active{background:var(--soft);color:#36594a}.pane[hidden]{display:none}.note{font-size:.76rem;color:var(--muted);margin-top:11px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303b36;color:white;border-radius:12px;padding:11px 15px;z-index:9;max-width:90%}.totalbox{background:#e9eeeb;border:1px solid #d2dcd6;border-radius:15px;padding:13px;margin-top:12px}.totalbox strong{font-size:1.8rem;display:block}.label{font-size:.78rem;color:var(--muted)}@media(min-width:620px){.app{padding:25px 20px}.hero{padding:25px}}

html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.app{max-width:560px;padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.hero{padding:16px;border-radius:20px}
.hero h1{font-size:1.45rem;margin:0 0 3px}
.date{font-size:.85rem}
.stats{gap:8px;margin-top:12px}
.stat{padding:10px 12px}
.stat span{display:block;font-size:.74rem}
.stat strong{font-size:1.4rem;margin-top:2px}
.section{margin-top:12px;padding:14px;border-radius:20px}
.head{margin-bottom:12px}
.headbtns{display:flex;gap:8px}
.secondary{padding:8px 12px;font-size:.85rem}
.datebar{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:8px;margin-bottom:12px}
.datearrow{width:46px;height:46px;padding:0;border-radius:12px;font-size:1.5rem;line-height:1}
.datebar input[type=date],.monthpick{display:block;width:100%;min-width:0;height:46px;min-height:46px;padding:0 10px;text-align:center;font-size:1rem;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;-webkit-appearance:none;appearance:none}
.datebar input[type=date]::-webkit-date-and-time-value,.monthpick::-webkit-date-and-time-value{text-align:center}
.prayerlist{gap:8px}
.prayer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:16px}
.prayericon{width:36px;height:36px;border-radius:12px;font-size:1.05rem}
.pinfo{min-width:0}
.pname{font-weight:800;font-size:1rem}
.rakats{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{margin-top:0;display:flex;gap:6px}
.toggle .btn{flex:none;width:80px;padding:10px 2px;text-align:center;font-size:.76rem;border-radius:12px;white-space:nowrap}
@media(max-width:339px){.prayer{grid-template-columns:auto minmax(0,1fr)}.toggle{grid-column:1/-1}.toggle .btn{flex:1}}
.step{width:40px;height:40px}
.counterrow{padding:10px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:536px;margin:0;gap:4px;padding:5px;border-radius:18px;z-index:5;background:rgba(247,248,247,.95);box-shadow:0 8px 25px #26352e22}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.72rem;line-height:1.1}
.nav i{font-style:normal;font-size:1.1rem}
.reportbox,.totalbox{padding:12px}
@media(max-width:400px){.prayer{grid-template-columns:minmax(0,1fr) auto}.prayericon{display:none}}
@media(max-width:339px){.prayer{grid-template-columns:minmax(0,1fr)}.toggle{grid-column:auto}.toggle .btn{flex:1;width:auto}}
</style></head><body><main class="app">
<header class="hero"><div class="herohead"><div><h1>Mihrab Salah ☾</h1><div id="todayLabel" class="date"></div></div></div><div class="stats"><div class="stat"><span>Marked</span><strong id="dayCount">0 / 5</strong></div><div class="stat"><span>Qaza rakaat owed</span><strong id="owedTop">0</strong></div></div></header>
<section class="section pane" id="todayPane"><div class="head"><h2>Daily Salah</h2><div class="headbtns"><button id="todayBtn" class="secondary">Today</button><button id="clearDay" class="secondary">Clear</button></div></div><div class="datebar"><button id="prevDay" class="datearrow" aria-label="Previous day">‹</button><input type="date" id="dayPick" aria-label="Prayer date"><button id="nextDay" class="datearrow" aria-label="Next day">›</button></div><div id="prayerList" class="prayerlist"></div></section>
<section class="section pane" id="qazaPane" hidden><div class="head"><h2>Outstanding Qaza</h2></div><div id="counterList"></div><div class="totalbox"><span class="label">TOTAL OUTSTANDING FARD RAKAAT</span><strong id="qazaTotal">0</strong><div class="sub">Fajr 2 · Dhuhr 4 · Asr 4 · Maghrib 3 · Isha 4</div></div></section>
<section class="section pane" id="monthPane" hidden><div class="head"><h2>Monthly progress</h2></div><input class="monthpick" id="monthPick" type="month" aria-label="Select month"><div id="monthlyContent"></div></section>
<section class="section pane" id="settingsPane" hidden><h2>Privacy & backup</h2><p>Your records are saved privately on this device.</p><button class="primary" id="exportBtn">Export backup</button><label class="secondary" for="importFile" style="display:block;text-align:center;margin-top:9px">Import backup</label><input id="importFile" type="file" accept="application/json,.json" hidden><button class="secondary" id="resetAll" style="width:100%;margin-top:10px;color:#9b4141">Erase all local data</button></section>
<nav class="nav"><button data-pane="todayPane" class="active"><i>☾</i>Today</button><button data-pane="qazaPane"><i>↻</i>Qaza</button><button data-pane="monthPane"><i>▦</i>Progress</button><button data-pane="settingsPane"><i>⚙</i>Backup</button></nav></main>
<script>
const P=[{k:'fajr',n:'Fajr',r:2,i:'☼'},{k:'dhuhr',n:'Dhuhr',r:4,i:'☀'},{k:'asr',n:'Asr',r:4,i:'◉'},{k:'maghrib',n:'Maghrib',r:3,i:'◒'},{k:'isha',n:'Isha',r:4,i:'☾'}],STORE='salah-v2-private';
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>iso(new Date()),currentMonth=()=>today().slice(0,7);
function blank(){return {version:2,balances:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},days:{},completions:{}}}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));if(x&&x.version===2&&x.days&&x.balances&&x.completions)return x}catch(e){}return blank()}
let db=load();
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){say('Storage unavailable; please export a backup.')}stats()}
function record(date){if(!db.days[date])db.days[date]={};return db.days[date]}
function say(t){}
function owed(){return P.reduce((s,p)=>s+(+db.balances[p.k]||0)*p.r,0)}
function countForDay(date){let r=db.days[date]||{};return P.filter(p=>r[p.k]==='on'||r[p.k]==='qaza').length}
function stats(){let d=document.getElementById('dayPick').value||today();document.getElementById('dayCount').textContent=countForDay(d)+' / 5';document.getElementById('owedTop').textContent=owed();document.getElementById('qazaTotal').textContent=owed()}
function renderDaily(){let date=document.getElementById('dayPick').value||today(),r=db.days[date]||{};document.getElementById('prayerList').innerHTML=P.map(p=>{let s=r[p.k]||'';return `<article class="prayer ${s==='on'?'is-on':s==='qaza'?'is-qaza':''}"><div class="prayericon">${p.i}</div><div class="pinfo"><div class="pname">${p.n}</div><div class="rakats">${p.r} rakaat</div></div><div class="toggle"><button class="btn green ${s==='on'?'active':''}" data-status="on" data-key="${p.k}" aria-pressed="${s==='on'}">${s==='on'?'✓ ':''}On time</button><button class="btn yellow ${s==='qaza'?'active':''}" data-status="qaza" data-key="${p.k}" aria-pressed="${s==='qaza'}">${s==='qaza'?'✓ ':''}Qaza</button></div></article>`}).join('');stats()}
function changeStatus(k,newStatus){let date=document.getElementById('dayPick').value||today(),r=record(date),old=r[k]||'',p=P.find(x=>x.k===k);if(old===newStatus){delete r[k];if(old==='qaza'){db.balances[k]=Math.max(0,(+db.balances[k]||0)-1)}save();renderDaily();renderCounters();renderMonth();say(`${p.n} mark removed.`);return}
if(old==='qaza')db.balances[k]=Math.max(0,(+db.balances[k]||0)-1);
if(newStatus==='qaza')db.balances[k]=(+db.balances[k]||0)+1;
r[k]=newStatus;save();renderDaily();renderCounters();renderMonth();say(newStatus==='qaza'?`${p.n}: +${p.r} outstanding Fard rakaat.`:`${p.n} marked on time.`)}
function renderCounters(){document.getElementById('counterList').innerHTML=P.map(p=>{let n=+db.balances[p.k]||0;return `<div class="counterrow"><div class="cmeta"><b>${p.n}</b><small>${n} prayers · ${n*p.r} rakaat remaining</small></div><button class="step" data-delta="-1" data-key="${p.k}" aria-label="Complete one ${p.n} Qaza">−</button><span class="count">${n}</span><button class="step" data-delta="1" data-key="${p.k}" aria-label="Add one ${p.n} Qaza">+</button></div>`}).join('');stats()}
function changeBalance(k,delta){let n=+db.balances[k]||0;if(delta<0&&n===0)return;db.balances[k]=Math.max(0,n+delta);if(delta<0){let date=today();db.completions[date]=db.completions[date]||{};db.completions[date][k]=(+db.completions[date][k]||0)+1;say(`One ${P.find(p=>p.k===k).n} Qaza completed: ${P.find(p=>p.k===k).r} rakaat logged.`)}else say('Outstanding Qaza count increased.');save();renderCounters();renderMonth()}
function monthData(m){let logged={},done={};P.forEach(p=>{logged[p.k]=0;done[p.k]=0});for(const [date,rec] of Object.entries(db.days)){if(date.startsWith(m))for(const p of P)if(rec[p.k]==='qaza')logged[p.k]++}for(const [date,rec] of Object.entries(db.completions)){if(date.startsWith(m))for(const p of P)done[p.k]+=(+rec[p.k]||0)}let loggedR=P.reduce((s,p)=>s+logged[p.k]*p.r,0),doneR=P.reduce((s,p)=>s+done[p.k]*p.r,0);return {logged,done,loggedR,doneR}}
function renderMonth(){let m=document.getElementById('monthPick').value||currentMonth(),x=monthData(m),pct=x.loggedR?Math.min(100,Math.round(x.doneR/x.loggedR*100)):0;document.getElementById('monthlyContent').innerHTML=`<div class="stats"><div class="stat"><span>Qaza logged (rakaat)</span><strong>${x.loggedR}</strong></div><div class="stat"><span>Made up (rakaat)</span><strong>${x.doneR}</strong></div></div><div class="reportbox"><div style="display:flex;justify-content:space-between;gap:10px"><b>Monthly Qaza progress</b><b>${pct}%</b></div><div class="progresswrap"><div class="progress ${pct===100?'':'yellow'}" style="width:${pct}%"></div></div><div class="sub">${x.doneR} rakaat completed against ${x.loggedR} rakaat logged as Qaza this month</div><div class="reportrow" style="margin-top:9px"><span>Current outstanding Qaza</span><strong>${owed()} rakaat</strong></div></div><div class="reportbox"><h2>By prayer</h2>${P.map(p=>`<div class="reportrow"><span>${p.n} · ${p.r} Fard rakaat</span><strong>${x.logged[p.k]} logged (${x.logged[p.k]*p.r})<br>${x.done[p.k]} made up (${x.done[p.k]*p.r})</strong></div>`).join('')}</div>`}
document.getElementById('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('dayPick').value=today();document.getElementById('dayPick').max=today();document.getElementById('monthPick').value=currentMonth();
document.getElementById('prayerList').addEventListener('click',e=>{let b=e.target.closest('[data-status]');if(b)changeStatus(b.dataset.key,b.dataset.status)});
document.getElementById('dayPick').addEventListener('change',renderDaily);
function shiftDay(delta){const el=document.getElementById('dayPick');const d=new Date((el.value||today())+'T12:00:00');d.setDate(d.getDate()+delta);if(iso(d)>today())return;el.value=iso(d);renderDaily()}
document.getElementById('prevDay').addEventListener('click',()=>shiftDay(-1));
document.getElementById('nextDay').addEventListener('click',()=>shiftDay(1));
document.getElementById('todayBtn').addEventListener('click',()=>{document.getElementById('dayPick').value=today();renderDaily()});
document.getElementById('counterList').addEventListener('click',e=>{let b=e.target.closest('[data-delta]');if(b)changeBalance(b.dataset.key,+b.dataset.delta)});
document.getElementById('monthPick').addEventListener('change',renderMonth);
document.getElementById('clearDay').addEventListener('click',()=>{let date=document.getElementById('dayPick').value||today(),r=db.days[date]||{};if(!confirm('Remove all marks for this date? Qaza marks removed here will also be subtracted from outstanding counts.'))return;for(const p of P)if(r[p.k]==='qaza')db.balances[p.k]=Math.max(0,(+db.balances[p.k]||0)-1);delete db.days[date];save();renderDaily();renderCounters();renderMonth();say('Day cleared.')});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.hidden=x.id!==b.dataset.pane);if(b.dataset.pane==='monthPane')renderMonth()}));
document.getElementById('exportBtn').addEventListener('click',()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download=`salah-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.version!==2||!x.days||!x.balances||!x.completions)throw 0;if(!confirm('Replace this device’s current data with the imported backup?'))return;db=x;save();renderDaily();renderCounters();renderMonth();say('Backup imported.')}catch(err){alert('Invalid Salah Tracker v2 backup.')}e.target.value=''});
document.getElementById('resetAll').addEventListener('click',()=>{if(!confirm('Erase all Salah Tracker data saved in this browser?'))return;db=blank();save();renderDaily();renderCounters();renderMonth();say('Local data erased.')});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderDaily();renderCounters();renderMonth();
</script></body></html>
